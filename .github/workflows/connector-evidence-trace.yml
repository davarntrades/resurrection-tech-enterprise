name: Governed connector evidence — production trace

# MANUAL ONLY. This performs ONE governed Amazon Bedrock invocation and then
# follows the evidence it produces all the way to the customer-facing monthly
# artefact. It is deliberately not on push or schedule: the invocation is
# chargeable, so it runs when someone asks for it and not otherwise.
#
#   canonical action → proposal → Runtime Governance → Bedrock invocation
#     → immutable evidence → connector audit projection
#     → persisted rg_reports.connector_activity → monthly HTML → monthly PDF
#
# Exactly one provider call: the smoke below makes it, the trace step makes
# none. The job does not retry, so a failure can never turn into a second
# chargeable invocation.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override the target base URL (leave blank to resolve the deployment for this commit)"
        required: false
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_ADMIN_KEY: ${{ secrets.RUNTIME_ADMIN_KEY }}
      E2E_ORG_ID: ${{ secrets.E2E_ORG_ID || vars.E2E_ORG_ID }}
      E2E_ENVIRONMENT_ID: ${{ vars.CUSTOMER_SUPPORT_SMOKE_ENVIRONMENT_ID || vars.E2E_ENVIRONMENT_ID || secrets.E2E_ENVIRONMENT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # E2E_BASE_URL is not a stored secret in this repository — the production
      # E2E resolves it from the successful deployment for the commit, and this
      # trace has to resolve it the same way or it targets nothing.
      - name: Resolve the production base URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_E2E_BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL || vars.E2E_BASE_URL }}
          TARGET_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          candidate="$CONFIGURED_E2E_BASE_URL"
          # Resolution order, most explicit first:
          #   1. a configured value (secret/variable/input) — always wins;
          #   2. a successful PRODUCTION deployment for this commit;
          #   3. the most recent successful production deployment on the default
          #      branch. A commit that only touches workflows or docs may produce
          #      no deployment of its own, and that must not make the target
          #      unresolvable — the running application is still the right target.
          resolve_from () {   # $1 = deployments query
            gh api --paginate -H "Accept: application/vnd.github+json" "$1" \
              | jq -r '.[] | select((.environment // "") == "Production") | .id' \
              | while read -r deployment_id; do
                  [[ -n "$deployment_id" ]] || continue
                  gh api -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=100" \
                    | jq -r '.[] | select(.state == "success") | .environment_url // empty' | head -n 1
                done | head -n 1
          }
          if [[ -z "$candidate" ]]; then
            for attempt in {1..12}; do
              candidate="$(resolve_from "/repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&per_page=100")"
              [[ -n "$candidate" ]] && { echo "resolved from: this commit"; break; }
              candidate="$(resolve_from "/repos/${GITHUB_REPOSITORY}/deployments?ref=${DEFAULT_BRANCH}&per_page=100")"
              [[ -n "$candidate" ]] && { echo "resolved from: latest production deployment on ${DEFAULT_BRANCH}"; break; }
              sleep 10
            done
          else
            echo "resolved from: configured value"
          fi
          if [[ -z "$candidate" ]]; then
            echo "::error::No production deployment URL could be resolved and no base URL was supplied. Refusing to run — a trace with no target would make a provider call and prove nothing. Set the E2E_BASE_URL repository variable, or re-dispatch with the base_url input." >&2
            exit 1
          fi
          safe_url="$(node -e '
            const url = new URL(process.argv[1]);
            if (url.protocol !== "https:") throw new Error("resolved deployment URL must use HTTPS");
            url.search = ""; url.hash = "";
            process.stdout.write(url.toString().replace(/\/$/, ""));
          ' "$candidate")"
          echo "::add-mask::$safe_url"
          echo "E2E_BASE_URL=$safe_url" >> "$GITHUB_ENV"
          echo "base URL resolved: yes"
      - name: Preflight — fail closed before any provider call
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL RUNTIME_ADMIN_KEY E2E_ORG_ID E2E_ENVIRONMENT_ID; do
            if [[ -n "${!name:-}" ]]; then echo "$name configured: yes"; else echo "$name configured: no"; missing=1; fi
          done
          exit "$missing"
      # Prove the target actually serves the governed admin API BEFORE spending a
      # provider call. A resolved-but-wrong deployment answers 404 here, which is
      # a configuration fact worth stating plainly rather than discovering as an
      # opaque crash three requests into the smoke.
      - name: Verify the target serves the governed admin API
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/probe.json -w "%{http_code}" \
            -H "x-admin-key: ${RUNTIME_ADMIN_KEY}" \
            ${VERCEL_AUTOMATION_BYPASS_SECRET:+-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"} \
            "${E2E_BASE_URL}/api/runtime/admin/customer-support-workflow?org_id=${E2E_ORG_ID}&environment_id=${E2E_ENVIRONMENT_ID}" || echo 000)
          echo "admin API probe: HTTP $status"
          if [[ "$status" != "200" ]]; then
            echo "::error::The resolved target answered HTTP $status for the governed admin API, so it is not the running application. Refusing to spend a provider call against it. Re-dispatch with the base_url input set to the production URL." >&2
            exit 1
          fi
      - name: Governed Bedrock invocation (exactly one)
        run: node scripts/runtime/customer-support-production-smoke.cjs
      - name: Trace the evidence to the monthly artefact (no provider calls)
        run: node scripts/runtime/connector-evidence-trace.cjs
      - name: Publish the trace
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/connector-evidence-trace.md ]]; then
            cat artifacts/connector-evidence-trace.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Governed connector evidence trace" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed before a structured trace was produced. Inspect the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-evidence-trace
          path: |
            artifacts/connector-evidence-trace.json
            artifacts/customer-support-production-smoke.json
          if-no-files-found: warn
          retention-days: 30
