name: E2E — Control Room Preview (production)

# Automatic gate: reproduces Customers → Dry Run Customer → Audit pack → Preview
# on the LIVE site (WebKit / Safari engine). If Preview does not open the PDF,
# this job fails — and so does the build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6h, catch production drift

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit (Safari engine)
        run: npx playwright install --with-deps webkit
      - name: Run production Preview E2E
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RUNTIME_ADMIN_KEY: ${{ secrets.RUNTIME_ADMIN_KEY }}
          E2E_CUSTOMER: ${{ vars.E2E_CUSTOMER || 'Dry Run Customer' }}
      - name: Run governed Customer Support production validation
        if: hashFiles('.github/customer-support-production-smoke') != ''
        run: node scripts/runtime/customer-support-production-smoke.cjs
        env:
          CUSTOMER_SUPPORT_E2E_BASE_URL: https://resurrection-tech-enterprise-git-a-f64a6d-davarntrades-projects.vercel.app
          RUNTIME_ADMIN_KEY: ${{ secrets.RUNTIME_ADMIN_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CUSTOMER_SUPPORT_SMOKE_REPORT: customer-support-production-smoke.json
      - name: Upload Customer Support production validation
        if: always() && hashFiles('.github/customer-support-production-smoke') != ''
        uses: actions/upload-artifact@v4
        with:
          name: customer-support-production-smoke
          path: customer-support-production-smoke.json
          if-no-files-found: ignore
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore