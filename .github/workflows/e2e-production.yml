name: E2E — Control Room Preview (production)

# DORMANT — manual-only. Reproduces Customers → Dry Run Customer → Audit pack →
# Preview on the LIVE site (WebKit / Safari engine). Deliberately does NOT run on
# push / pull_request / merge / schedule / deployment; it runs only when a
# maintainer triggers it. It also does nothing against production until the
# required repository secrets (E2E_BASE_URL, ADMIN_USER, ADMIN_PASSWORD,
# RUNTIME_ADMIN_KEY) are configured. Full hardening (secret preflight + docs) is
# tracked in a separate PR.
on:
  workflow_dispatch:

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit (Safari engine)
        run: npx playwright install --with-deps webkit
      - name: Run production Preview E2E
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RUNTIME_ADMIN_KEY: ${{ secrets.RUNTIME_ADMIN_KEY }}
          E2E_CUSTOMER: ${{ vars.E2E_CUSTOMER || 'Dry Run Customer' }}
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
