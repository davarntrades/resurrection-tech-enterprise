[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guardianos"
version = "0.1.0"
description = "Official GuardianOS Integration Gateway SDK"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
